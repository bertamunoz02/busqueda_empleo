name: Actualizar ofertas

on:
  schedule:
    - cron: "17 5 * * *"   # cada día hacia las 7:17 (hora de Madrid en verano)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-ofertas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer portales de empleo
        run: python scraper/fetch_jobs.py

      - name: Guardar cambios
        run: |
          git config user.name "actualizador-ofertas"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Ofertas actualizadas $(date -u +'%Y-%m-%d')"
            git push
          fi
